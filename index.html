<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1914">
<title>Cuestionario: Madres y Abuelas de Plaza de Mayo</title>
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#1b1914; --paper:#e2d8c0; --paper-hi:#f0e9d6; --ink:#16130e; --ink-2:#51493b; --red:#a3291f;
  --c1:#b3382c; --c2:#2f5f93; --c3:#bd9017; --c4:#3f7550;
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .2  0 0 0 0 .15  0 0 0 0 .08  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;color:var(--ink);font:400 18px/1.5 "Old Standard TT",Georgia,"Times New Roman",serif;
  background:var(--grain),radial-gradient(120% 90% at 50% 0%,#2b2821 0%,#14120e 72%);background-color:var(--desk);
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.stage{max-width:520px;margin:0 auto;padding:22px 14px 48px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #f0e9d6;outline-offset:3px}

.clip{position:relative;transform:rotate(var(--r,0deg));filter:drop-shadow(0 1px 1px rgba(0,0,0,.45)) drop-shadow(0 14px 16px rgba(0,0,0,.4))}
.paper{position:relative;background:var(--grain),radial-gradient(130% 110% at 25% 15%,var(--paper-hi) 0%,var(--paper) 62%,#cbbf9e 100%);clip-path:var(--tear,none);padding:22px 24px}
.paper.c1,.paper.c2,.paper.c3,.paper.c4{color:#fff9ec}
.paper.c1{background:var(--grain),var(--c1)}.paper.c2{background:var(--grain),var(--c2)}
.paper.c3{background:var(--grain),var(--c3)}.paper.c4{background:var(--grain),var(--c4)}
.tape{position:absolute;top:-13px;left:50%;width:112px;height:30px;background:rgba(214,196,150,.82);transform:translateX(-50%) rotate(var(--tr,-2deg));z-index:2;
  clip-path:polygon(0 12%,3% 0,6% 14%,9% 2%,12% 12%,88% 12%,91% 0,94% 14%,97% 2%,100% 12%,100% 88%,97% 100%,94% 86%,91% 98%,88% 88%,12% 88%,9% 100%,6% 86%,3% 98%,0 88%)}

.typed{font-family:"Special Elite","Courier New",monospace;font-size:.95rem;color:var(--ink-2)}
.on-desk{color:#cfc5aa}
h1,h2,h3{font-weight:700;line-height:1.08;letter-spacing:-.012em}
.h-l{font-size:clamp(1.9rem,8vw,2.6rem)}
.h-m{font-size:clamp(1.3rem,5.4vw,1.7rem);line-height:1.18}
.deck{font-style:italic;font-size:1.1rem;color:var(--ink-2)}
.rule{height:0;border-top:3px double var(--ink);margin:20px 0 16px}
.mt{margin-top:18px}
.center{text-align:center}

.btn{appearance:none;border:0;background:var(--ink);color:var(--paper-hi);font-weight:700;font-size:1.15rem;padding:15px 26px;min-height:54px;box-shadow:5px 5px 0 var(--red);transition:transform .08s,box-shadow .08s;width:100%}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--red)}

.stamp{display:inline-block;font-family:"Special Elite","Courier New",monospace;font-size:1.3rem;text-transform:uppercase;letter-spacing:.07em;padding:.1em .6em;border:3px double currentColor;transform:rotate(-5deg);mix-blend-mode:multiply}
.stamp.ok{color:#2a6a3a}.stamp.no{color:var(--red)}.stamp.ink{color:var(--ink)}

.bar{height:10px;background:rgba(0,0,0,.16);margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--ink);transition:width .3s}

.opts{display:grid;gap:20px;margin-top:30px}
button.opt{appearance:none;border:0;background:none;text-align:left;color:inherit;width:100%;padding:0;position:relative}
button.opt:active:not(:disabled){transform:scale(.985)}
.opt .paper{display:flex;align-items:center;gap:14px;min-height:78px;padding:14px 16px;font-size:1.1rem;font-weight:700;line-height:1.22}
.opt .L{flex:none;display:grid;place-items:center;width:42px;height:42px;background:var(--paper-hi);color:var(--ink);font-size:1.5rem;transform:rotate(-4deg)}
.opt.dim{opacity:.38;filter:grayscale(.7)}
.opt .stamp{position:absolute;right:10px;top:-18px;z-index:3;background:rgba(240,233,214,.92);animation:slam .32s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes slam{from{transform:rotate(-5deg) scale(1.9);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:1}}

.big-n{font-size:clamp(3.4rem,18vw,5.4rem);font-weight:700;line-height:1}
.expl{font-weight:400;font-size:1.12rem;line-height:1.4}
.link{color:var(--ink);font-weight:700}
.qr-box{display:grid;place-items:center;background:#fff;padding:14px;margin:16px auto 10px;width:max-content;max-width:100%}
.url{font-family:"Special Elite","Courier New",monospace;font-size:.85rem;word-break:break-all;text-align:center;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){.opt .stamp{animation:none}.btn,.bar i{transition:none}}
</style>
</head>
<body>
<main id="root"></main>

<script>
const QUIZ=[
 {q:"¿En qué año surgieron las Madres de Plaza de Mayo?",o:["1977","1983","1987","1976"],c:0,
  e:"Surgieron en 1977, durante la última dictadura. El 30 de abril, catorce mujeres se reunieron por primera vez en la Plaza de Mayo."},
 {q:"¿Cómo nacieron las tradicionales rondas de las Madres?",o:["Eran una danza tradicional","La policía les ordenó circular y empezaron a caminar alrededor de la Pirámide de Mayo","Lo decidió el gobierno","Se inspiraron en una marcha internacional"],c:1,
  e:"Como la policía les ordenó circular, empezaron a caminar alrededor de la Pirámide de Mayo. Así nacieron las rondas."},
 {q:"¿Qué símbolo usan las Madres en la cabeza?",o:["Una boina","Un sombrero","Un pañuelo blanco","Una cinta celeste"],c:2,
  e:"El pañuelo blanco se volvió símbolo de identificación y, con los años, emblema de la lucha por los Derechos Humanos."},
 {q:"¿Cuál es la diferencia entre Madres y Abuelas?",o:["Las Madres buscaban a sus hijos desaparecidos y las Abuelas a sus nietos apropiados","Las Madres buscaban a sus nietos y las Abuelas a sus hijos","Son exactamente lo mismo","Las Abuelas surgieron después de 1983"],c:0,
  e:"Ambas luchaban por los Derechos Humanos, pero las Abuelas se concentraron en localizar a sus nietos y restituirles su identidad."},
 {q:"¿Qué permite el índice de abuelidad?",o:["Calcular la edad de los abuelos","Establecer el vínculo biológico entre abuelos y nietos mediante información genética","Encontrar documentos perdidos","Registrar nacimientos nuevos"],c:1,
  e:"Es un procedimiento científico que usa muestras de sangre de abuelos y otros familiares para saber si una persona pertenece a una familia que busca a un nieto."},
 {q:"¿Qué se creó en 1987 mediante la Ley 23.511?",o:["La Casa de la Memoria","El Archivo General de la Nación","El Banco Nacional de Datos Genéticos","El Museo de los Derechos Humanos"],c:2,
  e:"El Banco Nacional de Datos Genéticos guarda información genética de familiares de personas desaparecidas para identificar a los niños apropiados."},
 {q:"¿Cuándo comenzó la última dictadura cívico-militar argentina?",o:["1973","1979","1982","1976"],c:3,
  e:"Comenzó el 24 de marzo de 1976 y terminó en 1983, con el regreso de la democracia."},
 {q:"¿Qué se conmemora cada 24 de marzo en la Argentina?",o:["El Día de la Independencia","El Día Nacional de la Memoria por la Verdad y la Justicia","El Día de la Bandera","El Día del Trabajador"],c:1,
  e:"Es el Día Nacional de la Memoria por la Verdad y la Justicia, en recuerdo del golpe de 1976 y de las víctimas del terrorismo de Estado."},
 {q:"¿Cómo se llama el informe de la CONADEP que documentó los crímenes de la dictadura?",o:["Nunca Más","Juicio a las Juntas","Punto Final","Memoria Viva"],c:0,
  e:"En 1984 la CONADEP presentó el informe Nunca Más, que documentó miles de casos de desaparición forzada."},
 {q:"¿Qué derecho busca restituir el trabajo de las Abuelas a cada nieto o nieta?",o:["El derecho al voto","El derecho a la propiedad","El derecho a viajar","El derecho a la identidad"],c:3,
  e:"Buscan que cada persona apropiada recupere su verdadera identidad y pueda conocer su historia familiar."}
];
const LET=["A","B","C","D"];
const root=document.getElementById("root");
const E=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* recortes irregulares */
function tear(){
  const j=()=>(Math.random()*3.4).toFixed(1), p=[];
  for(let x=0;x<=100;x+=3.4)p.push(`${x}% ${j()}px`);
  for(let y=4;y<100;y+=8)p.push(`calc(100% - ${j()}px) ${y}%`);
  for(let x=100;x>=0;x-=3.4)p.push(`${x}% calc(100% - ${j()}px)`);
  for(let y=96;y>0;y-=8)p.push(`${j()}px ${y}%`);
  return `polygon(${p.join(",")})`;
}
function dress(){
  root.querySelectorAll(".paper:not([data-d])").forEach(p=>{p.dataset.d=1;p.style.setProperty("--tear",tear())});
  root.querySelectorAll(".clip:not([data-d])").forEach(c=>{
    c.dataset.d=1;c.style.setProperty("--r",((Math.random()-.5)*2).toFixed(2)+"deg");
    const t=c.querySelector(":scope > .tape");if(t)t.style.setProperty("--tr",((Math.random()-.5)*8).toFixed(1)+"deg");
  });
}
const tape=()=>'<i class="tape"></i>';
const card=(inner)=>`<div class="clip">${tape()}<div class="paper">${inner}</div></div>`;
function show(html){root.innerHTML=`<div class="stage">${html}</div>`;dress();window.scrollTo(0,0)}

/* ============================ CUESTIONARIO ============================ */
let order=[],i=0,score=0;

function intro(){
  show(card(`<p class="typed">Cuestionario</p>
    <h1 class="h-l mt">Madres y Abuelas de Plaza de Mayo</h1>
    <p class="deck mt">${QUIZ.length} preguntas para repasar lo que viste en la exposición. No hay tiempo límite: respondé a tu ritmo.</p>
    <div class="rule"></div>
    <button class="btn" id="go">Empezar</button>`));
  document.getElementById("go").onclick=begin;
}
function begin(){order=shuffle(QUIZ);i=0;score=0;ask()}

function ask(){
  const d=order[i];
  const opts=shuffle(d.o.map((t,k)=>({t,ok:k===d.c})));
  show(`<p class="typed on-desk">Pregunta ${i+1} de ${order.length}</p>
    <div class="clip mt">${tape()}<div class="paper"><div class="bar"><i style="width:${i/order.length*100}%"></i></div><h2 class="h-m">${E(d.q)}</h2></div></div>
    <div class="opts" id="opts">${opts.map((o,k)=>`<button class="opt clip" data-k="${k}"><div class="paper c${k+1}"><span class="L">${LET[k]}</span><span>${E(o.t)}</span></div></button>`).join("")}</div>
    <div id="after"></div>`);
  document.querySelectorAll("#opts .opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k,opts,d));
}

function answer(k,opts,d){
  const ok=opts[k].ok;if(ok)score++;
  document.querySelectorAll("#opts .opt").forEach((b,n)=>{
    b.disabled=true;
    const right=opts[n].ok;
    if(right)b.insertAdjacentHTML("afterbegin",'<span class="stamp ok">Correcta</span>');
    else if(n===k)b.insertAdjacentHTML("afterbegin",'<span class="stamp no">Incorrecta</span>');
    if(!right&&n!==k)b.classList.add("dim");
  });
  const last=i===order.length-1;
  document.getElementById("after").innerHTML=`<div class="clip mt" style="margin-top:34px">${tape()}<div class="paper"><p class="typed">Para entender</p><p class="expl mt">${E(d.e)}</p></div></div>
    <button class="btn mt" style="margin-top:26px" id="nx">${last?"Ver mi resultado":"Siguiente pregunta"}</button>`;
  dress();
  const nx=document.getElementById("nx");
  nx.onclick=()=>{if(last)final();else{i++;ask()}};
  nx.scrollIntoView({behavior:"smooth",block:"end"});
}

function final(){
  const n=order.length,r=score/n;
  const t=r>=.9?"Conocés muy bien esta historia":r>=.6?"¡Muy bien!":"Gracias por animarte";
  const m=r>=.9?"Tu memoria es parte de la lucha.":r>=.6?"Tenés buena base. Podés volver a la exposición para repasar lo que quedó.":"Cada dato que aprendiste cuenta. Podés recorrer la exposición de nuevo e intentarlo otra vez.";
  show(card(`<div class="center"><p class="typed">Resultado final</p><h2 class="h-l mt">${t}</h2>
    <p class="big-n mt">${score}<span class="h-m"> de ${n}</span></p><p class="typed">respuestas correctas</p>
    <p class="deck mt">${m}</p>
    <div class="rule"></div>
    <span class="stamp ink">Memoria, Verdad y Justicia</span>
    <p class="deck mt">La búsqueda de los nietos y nietas continúa. Si tenés dudas sobre tu propia identidad, podés contactar a Abuelas de Plaza de Mayo en <a class="link" href="https://www.abuelas.org.ar" target="_blank" rel="noopener">abuelas.org.ar</a>.</p>
    <button class="btn mt" style="margin-top:22px" id="again">Volver a intentar</button></div>`));
  document.getElementById("again").onclick=begin;
}

/* ============== Modo QR: agregá ?qr a la dirección para imprimir o proyectar el código ============== */
function qrMode(){
  const url=location.origin+location.pathname;
  show(card(`<div class="center"><p class="typed">Cuestionario</p><h2 class="h-l mt">Escaneá y respondé desde tu celular</h2>
    <div class="qr-box" id="qr"></div><p class="url">${E(url)}</p></div>`));
  const draw=()=>{try{new QRCode(document.getElementById("qr"),{text:url,width:240,height:240,colorDark:"#16130e",colorLight:"#ffffff"})}catch(e){}};
  const libs=["https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js","https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"];
  libs.reduce((p,u)=>p.then(()=>typeof QRCode!=="undefined"?0:new Promise(r=>{const s=document.createElement("script");s.src=u;s.onload=s.onerror=()=>r();document.head.appendChild(s)})),Promise.resolve()).then(draw);
}

new URLSearchParams(location.search).has("qr")?qrMode():intro();
</script>
</body>
</html>
